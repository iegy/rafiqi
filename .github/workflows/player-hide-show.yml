name: Quran player hide show

on:
  push:
    paths:
      - '.github/workflows/player-hide-show.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hide and reopen controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/quran-player.tsx')
          text = path.read_text()

          replacements = [
            (
              '  const [draggingPlayer, setDraggingPlayer] = useState(false);',
              '  const [draggingPlayer, setDraggingPlayer] = useState(false);\n  const [playerHidden, setPlayerHidden] = useState(false);'
            ),
            (
              '        playerOffset?: { x: number; y: number };\n      };',
              '        playerOffset?: { x: number; y: number };\n        playerHidden?: boolean;\n      };'
            ),
            (
              '      if (saved.playerOffset && Number.isFinite(saved.playerOffset.x) && Number.isFinite(saved.playerOffset.y)) {\n        setPlayerOffset({ x: saved.playerOffset.x, y: saved.playerOffset.y });\n      }',
              '      if (saved.playerOffset && Number.isFinite(saved.playerOffset.x) && Number.isFinite(saved.playerOffset.y)) {\n        setPlayerOffset({ x: saved.playerOffset.x, y: saved.playerOffset.y });\n      }\n      if (typeof saved.playerHidden === "boolean") setPlayerHidden(saved.playerHidden);'
            ),
            (
              '        playerWidth,\n        playerOffset,',
              '        playerWidth,\n        playerOffset,\n        playerHidden,'
            ),
            (
              '  }, [continueSurahs, playerOffset, playerWidth, repeatMode, selectedSurah, selectedVoiceKey, speed, volume]);',
              '  }, [continueSurahs, playerHidden, playerOffset, playerWidth, repeatMode, selectedSurah, selectedVoiceKey, speed, volume]);'
            ),
            (
              'className={`rafiqi-quran-floating fixed bottom-[calc(84px+env(safe-area-inset-bottom))] left-3 right-3 z-[80] md:bottom-5 md:left-auto md:right-6 ${draggingPlayer ? "is-dragging" : ""}`}',
              'className={`rafiqi-quran-floating fixed bottom-[calc(84px+env(safe-area-inset-bottom))] left-3 right-3 z-[80] md:bottom-5 md:left-auto md:right-6 ${draggingPlayer ? "is-dragging" : ""} ${playerHidden ? "hidden" : ""}`}'
            ),
            (
              '<button className="grid h-9 w-9 place-items-center rounded-xl border border-border" onClick={() => setExpanded(false)} aria-label="تصغير المشغل">\n                  <X className="h-4 w-4" />\n                </button>',
              '<button className="grid h-9 w-9 place-items-center rounded-xl border border-border" onClick={() => { setExpanded(false); setPlayerHidden(true); }} aria-label="إخفاء المشغل" title="إخفاء المشغل">\n                  <X className="h-4 w-4" />\n                </button>'
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected snippet not found: {old[:100]}')
            text = text.replace(old, new, 1)

          compact_marker = '''            <button className="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-border" onClick={() => setExpanded((value) => !value)} aria-label={expanded ? "تصغير" : "توسيع"}>\n              {expanded ? <ChevronDown className="h-4 w-4" /> : <ChevronUp className="h-4 w-4" />}\n            </button>'''
          compact_replacement = '''            <button className="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-border" onClick={() => setPlayerHidden(true)} aria-label="إخفاء مشغل القرآن" title="إخفاء المشغل">\n              <X className="h-4 w-4" />\n            </button>\n            <button className="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-border" onClick={() => setExpanded((value) => !value)} aria-label={expanded ? "تصغير" : "توسيع"}>\n              {expanded ? <ChevronDown className="h-4 w-4" /> : <ChevronUp className="h-4 w-4" />}\n            </button>'''
          if compact_marker not in text:
            raise SystemExit('Compact expand button not found')
          text = text.replace(compact_marker, compact_replacement, 1)

          ending = '''      </div>\n    </>\n  );\n}'''
          reopen = '''      </div>\n\n      {playerHidden && (\n        <button\n          className="fixed bottom-[calc(84px+env(safe-area-inset-bottom))] right-3 z-[81] flex h-12 items-center gap-2 rounded-full border border-border bg-card/95 px-4 text-sm font-bold text-foreground shadow-2xl backdrop-blur-xl md:bottom-5 md:right-6"\n          onClick={() => setPlayerHidden(false)}\n          aria-label="إظهار مشغل القرآن"\n          title="إظهار مشغل القرآن"\n        >\n          <BookOpen className="h-5 w-5 text-primary" />\n          <span>مشغل القرآن</span>\n          {isPlaying && <span className="h-2 w-2 rounded-full bg-primary" aria-label="التلاوة تعمل" />}\n        </button>\n      )}\n    </>\n  );\n}'''
          if ending not in text:
            raise SystemExit('Component ending not found')
          text = text.replace(ending, reopen, 1)

          path.write_text(text)
          PY
      - name: Commit hide/show controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/quran-player.tsx
          git commit -m "Allow Quran player to hide and reopen"
          git push
