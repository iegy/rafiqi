name: Update Android version label

on:
  push:
    paths:
      - '.github/workflows/update-android-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Android version label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/rafiqi-app.tsx')
          s = p.read_text()
          old = 'Android v1.1.0'
          new = 'Android v1.2.0'
          if old not in s:
              raise SystemExit('Old Android version label not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit version label
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/rafiqi-app.tsx
          git commit -m "Update Android download label to v1.2.0"
          git push
